name: Semgrep (radar L7)

# Static-analysis security lint for the bug CLASSES that escaped review in this
# repo: fail-open default stores, security checks gated on an optional field
# (the "C1" pattern), and non-constant-time secret compares / catch-as-accept.
#
# Rules + fixtures + local runner live under harness/semgrep/.
#   - self-test: every *.bad.* fixture MUST fire, every *.good.* MUST stay clean
#   - scan:      run the ruleset over the real source tree (typescript/, go/, python/)
#
# Pull requests retain an advisory report while the multi-language remediation
# stack is landing. The reusable release-gate invocation sets `enforce: true`:
# a release can never pass with an untriaged source finding.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      enforce:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  semgrep:
    name: radar L7 rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Self-test rules against fixtures (blocking)
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e bash harness/semgrep/run.sh --test

      - name: Scan real source
        env:
          SEMGREP_ENFORCE: ${{ inputs.enforce && '1' || '0' }}
        run: |
          set +e
          SEMGREP_ERROR_ON_FINDINGS=1 docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e bash harness/semgrep/run.sh typescript go python
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if [ "$SEMGREP_ENFORCE" = "1" ]; then
              exit "$status"
            fi
            echo "::warning::Semgrep found blocking source matches; release-gate enforcement remains red until they are remediated."
          fi
